# XcodeGen spec. Edit this file, then run `xcodegen generate`. Never hand-edit the .xcodeproj.
# Signing and IDs live in Config/Base.xcconfig, overridden by the git-ignored Config/Signing.local.xcconfig.
name: Meridian

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Meridian:
    type: application
    platform: iOS
    sources:
      - path: Meridian
        excludes: ["Info.plist", "Meridian.entitlements"]
      - Shared
      - path: rules/platform-rules.json
        buildPhase: resources
      - path: rules/zone-countries.json
        buildPhase: resources
      - path: rules/network-logos.json
        buildPhase: resources
    info:
      path: Meridian/Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        MeridianAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Meridian/Meridian.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_NAME: Meridian
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meridian
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MeridianWidgets
        embed: true

  MeridianWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MeridianWidgets
        excludes: ["Info.plist", "MeridianWidgets.entitlements"]
      - Shared
    info:
      path: MeridianWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        MeridianAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MeridianWidgets/MeridianWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_NAME: MeridianWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meridian.widgets
        SKIP_INSTALL: YES

  MeridianTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeridianTests
        excludes: ["Fixtures/**"]
      - path: MeridianTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Meridian
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meridian.tests

  MeridianUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MeridianUITests
      - path: fidelity/inventory
        type: folder
        buildPhase: resources
    dependencies:
      - target: Meridian
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meridian.uitests
        TEST_TARGET_NAME: Meridian

schemes:
  # Screen checks against fidelity/inventory (D3-1). Separate from the Meridian scheme so the commit gate stays fast and
  # offline; run with fidelity/verify-screen.sh <screen>.
  MeridianFidelity:
    build:
      targets:
        Meridian: all
        MeridianUITests: [test]
    test:
      targets:
        - MeridianUITests
  Meridian:
    build:
      targets:
        Meridian: all
    test:
      targets:
        - MeridianTests
