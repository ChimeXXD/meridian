# XcodeGen spec. Edit this file, then run `xcodegen generate`. Never hand-edit the .xcodeproj.
# Signing and IDs live in Config/Base.xcconfig, overridden by the git-ignored Config/Signing.local.xcconfig.
name: Airstamp

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Airstamp:
    type: application
    platform: iOS
    sources:
      - path: Airstamp
        excludes: ["Info.plist", "Airstamp.entitlements"]
      - Shared
      - path: rules/platform-rules.json
        buildPhase: resources
      - path: rules/zone-countries.json
        buildPhase: resources
      - path: rules/network-logos.json
        buildPhase: resources
    info:
      path: Airstamp/Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        AirstampAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: Airstamp/Airstamp.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_NAME: Airstamp
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).airstamp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AirstampWidgets
        embed: true

  AirstampWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AirstampWidgets
        excludes: ["Info.plist", "AirstampWidgets.entitlements"]
      - Shared
    info:
      path: AirstampWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        AirstampAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AirstampWidgets/AirstampWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_NAME: AirstampWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).airstamp.widgets
        SKIP_INSTALL: YES

  AirstampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AirstampTests
        excludes: ["Fixtures/**"]
      - path: AirstampTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Airstamp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).airstamp.tests

  AirstampUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AirstampUITests
      - path: fidelity/inventory
        type: folder
        buildPhase: resources
    dependencies:
      - target: Airstamp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).airstamp.uitests
        TEST_TARGET_NAME: Airstamp

schemes:
  # Screen checks against fidelity/inventory (D3-1). Separate from the Airstamp scheme so the commit gate stays fast and
  # offline; run with fidelity/verify-screen.sh <screen>.
  AirstampFidelity:
    build:
      targets:
        Airstamp: all
        AirstampUITests: [test]
    test:
      targets:
        - AirstampUITests
  Airstamp:
    build:
      targets:
        Airstamp: all
    test:
      targets:
        - AirstampTests
