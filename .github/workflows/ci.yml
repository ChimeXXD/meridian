# Build and test Meridian on GitHub's macOS runners (D6-4, D-35).
#
# Every push to main and every pull request, now that the repo is public and standard runners are free (Day 7,
# D-35). While it was private, this ran only by hand: the free plan's macOS minutes would not cover a push a commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 (arm64): Xcode 26.6 and iOS 26.5 simulators. The app targets iOS 26.0 and uses no iOS 27 API, so it
    # builds here even though it's developed on the iOS 27 toolchain.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        # Signing.local.xcconfig is git-ignored and optional (`#include?`); simulator builds need no Team ID.
        run: xcodegen generate

      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone 17 Pro \(" | head -3

      - name: Build and test
        # TEST_RUNNER_MERIDIAN_SYNC_RENDERS skips only the byte-for-byte check of the design system's widget and Live
        # Activity pictures (DesignSystemCopy): text renders a little differently on another iOS version, so those
        # are checked on the iOS 27 simulator by the local proof gate. Every other assertion in the render tests runs.
        # TEST_RUNNER_MERIDIAN_UNSIGNED skips the App Group container tests: CODE_SIGNING_ALLOWED=NO grants no
        # entitlements, so there is no container to find. The signed local proof gate runs them.
        env:
          TEST_RUNNER_MERIDIAN_SYNC_RENDERS: "1"
          TEST_RUNNER_MERIDIAN_UNSIGNED: "1"
        run: |
          set -o pipefail
          xcodebuild -scheme Meridian \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild.log | grep -E "✘|error:|Test run with|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Keep the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
