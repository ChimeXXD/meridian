<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 3 · Longitudes (line system): a globe drawn only by its meridians, spaced as on a sphere
       (x = 50 + 30·sin(k·22.5°)); one is yours, full strength, rising to the star. -->
  <defs>
    <clipPath id="m3-globe"><circle cx="50" cy="56" r="30"/></clipPath>
  </defs>
  <g clip-path="url(#m3-globe)" stroke="#F4EFE4" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round">
    <path d="M 22.28 20 V 92"/>
    <path d="M 28.79 20 V 92"/>
    <path d="M 38.52 20 V 92"/>
    <path d="M 61.48 20 V 92"/>
    <path d="M 71.21 20 V 92"/>
    <path d="M 77.72 20 V 92"/>
  </g>
  <path d="M 50 86 V 20" stroke="#F4EFE4" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="3.5" fill="#E9C46A"/>
</svg>
