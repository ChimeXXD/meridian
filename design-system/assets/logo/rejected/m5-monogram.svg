<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 5 · Lowercase m (lines + geometry): two arches built on one grid; the middle stem keeps rising past them
       as the meridian, with the star at its top. Stroke 4, arch radius 14. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 22 80 V 52 A 14 14 0 0 1 50 52"/>
    <path d="M 50 52 A 14 14 0 0 1 78 52 V 80"/>
    <path d="M 50 80 V 26"/>
  </g>
  <circle cx="50" cy="15" r="4" fill="currentColor"/>
</svg>
