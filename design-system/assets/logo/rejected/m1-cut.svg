<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 1 · The Cut (pure geometry): a solid globe split by one meridian, set off-centre — your meridian, not
       Greenwich's — with the star at the top of its line. -->
  <defs>
    <mask id="m1-cut">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="55" y="20" width="5" height="76" rx="2.5" fill="#000"/>
    </mask>
  </defs>
  <circle cx="50" cy="58" r="28" fill="currentColor" mask="url(#m1-cut)"/>
  <circle cx="57.5" cy="16" r="4" fill="currentColor"/>
</svg>
