<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 4 · Terminator (pure geometry, two tones): the line between day and night is a meridian. The night half is
       solid; the star sits above the line, on the night side of the moment. -->
  <circle cx="50" cy="58" r="27" fill="none" stroke="currentColor" stroke-width="3.5"/>
  <path d="M 50 31 A 27 27 0 0 0 50 85 Z" fill="currentColor"/>
  <circle cx="50" cy="16" r="4" fill="currentColor"/>
</svg>
